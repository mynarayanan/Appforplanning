<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unified Performance Planning Studio</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b2330;--mu:#667085;--bd:#e3e6eb;--ac:#2b59c3;--ok:#1a7f4b;--bad:#c23b3b;--wn:#b7791f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--tx:#e8ecf1;--mu:#8e99a8;--bd:#2c3440;--ac:#7aa2f7;--ok:#4cc38a;--bad:#f0787a;--wn:#e5b04a}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--tx:#e8ecf1;--mu:#8e99a8;--bd:#2c3440;--ac:#7aa2f7;--ok:#4cc38a;--bad:#f0787a;--wn:#e5b04a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0}h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--mu);font-size:12px}
select,button,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 9px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.4;cursor:not-allowed}
nav{display:flex;gap:4px;padding:10px 18px 0;overflow-x:auto}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mu);white-space:nowrap}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
main{padding:16px 18px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--mu)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600;font-size:12px}
tr.t td{font-weight:700}.pos{color:var(--ok)}.neg{color:var(--bad)}
.drv{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.drv label{display:block;font-size:12px;color:var(--mu)}
.drv .r{display:flex;gap:8px;align-items:center}.drv input[type=range]{flex:1;padding:0}
.drv output{min-width:64px;text-align:right;font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--bd)}
.Draft{color:var(--mu)}.Submitted{color:var(--wn)}.Approved{color:var(--ok)}.Rejected{color:var(--bad)}
textarea{width:100%;min-height:62px;margin:6px 0}
.note{font-size:12px;color:var(--mu);margin-top:6px}
.log div{padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px}
.slic{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.slic label{font-size:11px;color:var(--mu);display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.bar{display:grid;grid-template-columns:96px 1fr 64px;gap:8px;align-items:center;margin:6px 0;font-size:12px}.bar i{display:block;height:10px;background:var(--ac);border-radius:3px}.bar i.n{background:var(--bad)}.bar b{text-align:right}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.steps span{padding:3px 10px;border-radius:99px;border:1px solid var(--bd);font-size:12px;color:var(--mu)}.steps span.on{background:var(--ac);color:#fff;border-color:var(--ac)}.steps span.done{color:var(--ok);border-color:var(--ok)}
.sm{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}.sm button.on{background:var(--ac);color:#fff}
.l td,.l th{text-align:left}.l input,.l select{max-width:100%}
</style></head><body>
<header>
 <div><h1>Unified Performance Planning Studio</h1><div class="sub">Data-driven projections · Clear variance analysis · Human control · Figures in $k</div></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">
  
  <label class="sub">Signed in as <select id="role"><option value="owner">Line owner (MFA ✓)</option><option value="cfo">CFO (MFA ✓)</option><option value="admin">Admin (MFA ✓)</option><option value="view">Viewer</option></select></label>
 </div>
</header>
<nav id="nav"></nav>
<main id="v"></main>
<script>
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LY={rev:[820,790,860,900,940,980,960,1000,1050,1100,1180,1260],it:[48,48,49,50,50,51,52,52,53,54,55,56],ga:[96,96,97,98,98,99,100,100,101,102,103,104],gm:.62,mkt:.09,hc:22,cph:7.2};
const BUD={g:.12,gm:.63,hires:4,cph:7.5,mkt:.09,itg:.06,gag:.03};
const SC={Base:{g:.15,gm:.63,hires:5,cph:7.5,mkt:.09,itg:.06,gag:.03},Upside:{g:.22,gm:.64,hires:8,cph:7.5,mkt:.10,itg:.08,gag:.04},Downside:{g:.05,gm:.60,hires:1,cph:7.5,mkt:.07,itg:.03,gag:.02}};
const DEF=[['g','Revenue growth vs LY',0,.4,.01,'%'],['gm','Gross margin',.5,.75,.005,'%'],['hires','Net new hires in year',0,15,1,''],['cph','Cost per head /month ($k)',5,12,.1,''],['mkt','Marketing % of revenue',.03,.15,.005,'%'],['itg','IT/software cost growth',0,.2,.01,'%'],['gag','G&A cost growth',0,.1,.005,'%']];
const LINES=[['rev','Revenue'],['cogs','Cost of sales'],['gp','Gross profit'],['pay','Payroll'],['mkt','Marketing'],['it','Software & IT'],['ga','G&A'],['opex','Total opex'],['ebitda','EBITDA']];
const OWN={rev:'Sales lead',pay:'HR lead',mkt:'Marketing lead',it:'IT lead',ga:'Ops lead'};
const sum=a=>a.reduce((x,y)=>x+y,0);
function calc(d){const rev=rot(LY.rev).map(x=>x*(1+d.g)),cogs=rev.map(x=>x*(1-d.gm)),
 pay=MO.map((_,i)=>(LY.hc+d.hires*(i+1)/12)*d.cph),mkt=rev.map(x=>x*d.mkt),
 it=rot(LY.it).map(x=>x*(1+d.itg)),ga=rot(LY.ga).map(x=>x*(1+d.gag));
 const gp=rev.map((x,i)=>x-cogs[i]),opex=rev.map((_,i)=>pay[i]+mkt[i]+it[i]+ga[i]),ebitda=gp.map((x,i)=>x-opex[i]);
 return{rev,cogs,gp,pay,mkt,it,ga,opex,ebitda}}
function calcLY(){const rev=rot(LY.rev),cogs=rev.map(x=>x*(1-LY.gm)),pay=MO.map(()=>LY.hc*LY.cph),mkt=rev.map(x=>x*LY.mkt),it=rot(LY.it),ga=rot(LY.ga);
 const gp=rev.map((x,i)=>x-cogs[i]),opex=rev.map((_,i)=>pay[i]+mkt[i]+it[i]+ga[i]);return{rev,cogs,gp,pay,mkt,it,ga,opex,ebitda:gp.map((x,i)=>x-opex[i])}}
let ly,bud;const recal=()=>{ly=calcLY();bud=calc(BUD)};
let scen='Base',role='owner',tab='Dashboard',drivers={...SC.Base};
let cm={},st={},log=[];
const fmt=n=>Math.round(n).toLocaleString('en-US'),pc=n=>(n*100).toFixed(1)+'%';
const stamp=()=>new Date().toLocaleString();
const UL={cfo:'CFO',owner:'Line owner',admin:'Admin',view:'Viewer'};
function audit(a,o,n){log.unshift({t:stamp(),u:UL[role],a,o:o==null?'':o,n:n==null?'':n})}
function draft(k,p){const f=sum(p[k]),b=sum(bud[k]),l=sum(ly[k]),dv=f-b,cost=['pay','mkt','it','ga'].includes(k);
 const good=cost?dv<=0:dv>=0,name=LINES.find(x=>x[0]===k)[1];
 return `${name}: plan of ${fmt(f)}k is ${fmt(Math.abs(dv))}k (${pc(Math.abs(dv/b))}) ${dv>=0?'above':'below'} budget and ${pc((f-l)/l)} vs last year. This is ${good?'favourable':'unfavourable'} to EBITDA. Driver behind the movement: ${k==='rev'?'growth assumption of '+pc(drivers.g):k==='pay'?drivers.hires+' net hires at '+drivers.cph+'k/month':k==='mkt'?'spend ratio of '+pc(drivers.mkt)+' of revenue':'run-rate cost growth assumption'}. [Owner to add context and actions.]`}
function cls(v,cost){return(cost?v<=0:v>=0)?'pos':'neg'}
function render(){
 const p=calc(drivers),ro=role!=='owner';
 document.getElementById('nav').innerHTML=['Dashboard','Variance','Plan','Admin','Audit trail'].map(t=>`<button class="${t===tab?'on':''}" onclick="tab='${t}';render()">${t}</button>`).join('');
 let h='';
 if(tab==='Overview'){
  const e=sum(p.ebitda),eb=sum(bud.ebitda),el=sum(ly.ebitda),r=sum(p.rev);
  h+=`<div class="kpis"><div class="kpi"><span>FY Revenue</span><b>${fmt(r)}</b><span>${pc(r/sum(ly.rev)-1)} vs LY</span></div>
  <div class="kpi"><span>FY EBITDA</span><b>${fmt(e)}</b><span class="${cls(e-eb)}">${e-eb>=0?'+':''}${fmt(e-eb)} vs budget</span></div>
  <div class="kpi"><span>EBITDA margin</span><b>${pc(e/r)}</b><span>LY ${pc(el/sum(ly.rev))}</span></div>
  <div class="kpi"><span>Year-end headcount</span><b>${LY.hc+drivers.hires}</b><span>LY ${LY.hc}</span></div></div>
  <div class="card sc"><h2>Plan vs Budget vs Last Year (FY, $k)</h2><table><tr><th></th><th>Plan</th><th>Budget</th><th>Var vs Bud</th><th>Last Year</th><th>Var vs LY</th></tr>`;
  LINES.forEach(([k,n])=>{const f=sum(p[k]),b=sum(bud[k]),l=sum(ly[k]),cost=['cogs','pay','mkt','it','ga','opex'].includes(k);
   h+=`<tr class="${['gp','opex','ebitda'].includes(k)?'t':''}"><td>${n}</td><td>${fmt(f)}</td><td>${fmt(b)}</td><td class="${cls(f-b,cost)}">${fmt(f-b)}</td><td>${fmt(l)}</td><td class="${cls(f-l,cost)}">${fmt(f-l)}</td></tr>`});
  h+=`</table><div class="note">Every figure is computed by code from drivers. Variance text in Commentary is generated from these numbers only.</div></div>`;
 }
 if(tab==='Drivers'){
  h+=`<div class="card"><h2>Planning drivers · ${scen} scenario</h2>${ro?'<div class="note">Read-only for your role.</div>':''}<div class="drv">`;
  DEF.forEach(([k,n,mn,mx,s,u])=>{h+=`<div><label>${n}</label><div class="r"><input type="range" min="${mn}" max="${mx}" step="${s}" value="${drivers[k]}" ${ro?'disabled':''} oninput="setD('${k}',this.value,this)"><output>${u?pc(drivers[k]):drivers[k]}</output></div><div class="sub">Budget: ${u?pc(BUD[k]):BUD[k]}</div></div>`});
  h+=`</div><div class="note">Changing a driver re-opens approval on all commentary.</div></div>`;
 }
 if(tab==='Monthly P&L'){
  h+=`<div class="card sc"><h2>Monthly plan ($k) · FY starts ${MO[CAL.s-1]}</h2><table><tr><th></th>${FMS().map(m=>`<th>${m}</th>`).join('')}<th>FY</th></tr>`;
  LINES.forEach(([k,n])=>{h+=`<tr class="${['gp','opex','ebitda'].includes(k)?'t':''}"><td>${n}</td>${p[k].map(x=>`<td>${fmt(x)}</td>`).join('')}<td><b>${fmt(sum(p[k]))}</b></td></tr>`});
  h+=`</table></div>`;
 }
 if(tab==='Commentary'){
  h+=`<div class="card"><h2>Variance commentary · review workflow</h2><div class="note" style="margin:-6px 0 8px">Owners edit and submit; the CFO approves or rejects. Switch role (top right) to try both.</div></div>`;
  Object.keys(OWN).forEach(k=>{const s=st[k]||'Draft';if(cm[k]==null)cm[k]=draft(k,p);
   h+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${LINES.find(x=>x[0]===k)[1]} <span class="sub">· ${OWN[k]}</span></b><span class="pill ${s}">${s}</span></div>
   <textarea ${role!=='owner'||s==='Approved'?'disabled':''} oninput="cm['${k}']=this.value">${cm[k]}</textarea>
   <button ${role!=='owner'||s==='Approved'||s==='Submitted'?'disabled':''} onclick="regen('${k}')">Regenerate draft</button>
   <button class="p" ${role!=='owner'||s==='Submitted'||s==='Approved'?'disabled':''} onclick="setS('${k}','Submitted')">Submit to CFO</button>
   <button class="p" ${role!=='cfo'||s!=='Submitted'?'disabled':''} onclick="setS('${k}','Approved')">Approve</button>
   <button ${role!=='cfo'||s!=='Submitted'?'disabled':''} onclick="setS('${k}','Rejected')">Reject</button></div>`});
 }
 if(tab==='Audit trail'){h+=`<div class="card log"><h2>Audit trail</h2>${log.length?`<div class="sc l"><table><tr><th>Timestamp</th><th>User</th><th>Change</th><th>Old value</th><th>New value</th></tr>${log.map(x=>`<tr><td>${x.t}</td><td>${x.u}</td><td>${x.a}</td><td class="neg">${x.o}</td><td class="pos">${x.n}</td></tr>`).join('')}</table></div>`:'<div class="sub">No activity yet.</div>'}<div class="note">Production: immutable log with SSO/MFA identity, enforced by role-based access on the server.</div></div>`}
 if(tab==='Dashboard')h+=dash();if(tab==='Variance')h+=vari();if(tab==='Plan')h+=plan3();if(tab==='Admin')h+=admin();
 document.getElementById('v').innerHTML=h;
}
window.dOld={};function setD(k,v,el){if(!(k in dOld))dOld[k]=drivers[k];drivers[k]=+v;el.nextElementSibling.textContent=DEF.find(d=>d[0]===k)[5]?pc(+v):v;
 Object.keys(OWN).forEach(x=>{cm[x]=null;st[x]='Draft'});
 clearTimeout(window.t);window.t=setTimeout(()=>{audit('Driver · '+k,dOld[k],drivers[k]);delete dOld[k];},600)}
function setS(k,s){const o=st[k]||'Draft';st[k]=s;audit('Commentary · '+LINES.find(x=>x[0]===k)[1],o,s);render()}
function regen(k){cm[k]=draft(k,calc(drivers));audit('regenerated draft for '+k);render()}
document.getElementById('role').onchange=e=>{role=e.target.value;render()};
/* ===== Fiscal calendar ===== */
const CAL={s:1,fy:2026,prior:1,future:1},LOCK={'2026-1':1,'2026-2':1,'2026-3':1};
let VERS=[{n:'Actual',st:'Open'},{n:'Budget',st:'Approved'},{n:'Forecast',st:'Draft'}];
const fp=r=>({fy:CAL.s===1||r.m<CAL.s?r.y:r.y+1,p:((r.m-CAL.s+12)%12)+1});
const FM=i=>MO[(CAL.s-1+i)%12],FMS=()=>MO.map((_,i)=>FM(i)),rot=a=>a.map((_,j)=>a[(CAL.s-1+j)%12]);
const calYears=()=>{const a=[];for(let y=CAL.fy-CAL.prior;y<=CAL.fy+CAL.future;y++)a.push(y);return a};
function syncS(fy){S.y=fy;S.ver='Actual';S.to=Math.max(1,...LED.filter(r=>r.v==='Actual'&&fp(r).fy===fy).map(r=>fp(r).p))}
function calSet(k,v){const o=CAL[k];CAL[k]=+v;recal();if(k!=='prior'&&k!=='future')syncS(CAL.fy);audit('Calendar · '+k,o,+v);render()}
/* ===== Ledger, metadata, hierarchy ===== */
let ACC=[{c:'4000',n:'Revenue',g:'Revenue',al:'Sales'},{c:'5000',n:'Cost of sales',g:'COGS',al:'COGS'},{c:'6000',n:'Payroll',g:'Opex',al:'Salaries'},{c:'6100',n:'Marketing',g:'Opex',al:'Advertising'},{c:'6200',n:'Software & IT',g:'Opex',al:'IT'},{c:'6300',n:'G&A',g:'Opex',al:'Admin'}];
let ENT=[{n:'Retail',p:'Consumer'},{n:'Online',p:'Consumer'},{n:'Wholesale',p:'Trade'}];
const DIVS=()=>[...new Set(ENT.map(e=>e.p))],CODES=ACC.map(a=>a.c);
const RB={Retail:400,Online:300,Wholesale:250},RT={Retail:[.42,.14,.05,.03,.06],Online:[.34,.10,.12,.05,.04],Wholesale:[.48,.08,.02,.02,.05]},SE=[.9,.85,.95,1,1.05,1.05,1,1,1.05,1.1,1.2,1.35];
function amt(m,e,ai,f){const ei=Object.keys(RB).indexOf(e),r=RB[e]*SE[m-1]*f;return ai?r*RT[e][ai-1]*(1+.04*Math.sin(m*3+ai+ei)):r}
let LED=[];
function gen(y,ms,v,f){ms.forEach(m=>Object.keys(RB).forEach(e=>CODES.forEach((c,ai)=>LED.push({y,m,e,a:c,v,x:+amt(m,e,ai,f).toFixed(1)}))))}
const M12=MO.map((_,i)=>i+1);gen(2025,M12,'Actual',1);gen(2026,[1,2,3,4,5,6],'Actual',1.12);gen(2026,M12,'Budget',1.14);gen(2026,M12,'Forecast',1.11);
/* ===== Dashboard ===== */
const S={y:2026,from:1,to:6,div:'All',ent:'All',ver:'Actual',met:'Revenue',cum:0,cmp:'Budget'};
const ents=()=>{let l=ENT.filter(e=>S.div==='All'||e.p===S.div);if(S.ent!=='All'&&l.some(e=>e.n===S.ent))l=l.filter(e=>e.n===S.ent);return l.map(e=>e.n)};
const O0=()=>({rev:0,cogs:0,opex:0,n:0}),addO=(a,b)=>({rev:a.rev+b.rev,cogs:a.cogs+b.cogs,opex:a.opex+b.opex,n:a.n+b.n});
function mm(y,ver,es){const a=M12.map(O0);LED.forEach(r=>{const q=fp(r);if(q.fy!==y||r.v!==ver||!es.includes(r.e))return;const g=(ACC.find(x=>x.c===r.a)||{}).g,o=a[q.p-1];o.n++;if(g==='Revenue')o.rev+=r.x;else if(g==='COGS')o.cogs+=r.x;else if(g==='Opex')o.opex+=r.x});return a}
const MV=(o,k)=>k==='Revenue'?o.rev:k==='Opex'?o.opex:k==='EBITDA'?o.rev-o.cogs-o.opex:o.rev?(o.rev-o.cogs)/o.rev:0;
const rng=(a,m1,m2)=>a.slice(m1-1,m2).reduce(addO,O0());
function ser(y,ver,es){let c=O0();return mm(y,ver,es).map(o=>{c=addO(c,o);return o.n?MV(S.cum?c:o,S.met):null})}
function sl(k,v){S[k]=['y','from','to','cum'].includes(k)?+v:v;if(k==='div')S.ent='All';if(S.from>S.to){if(k==='from')S.to=S.from;else S.from=S.to}render()}
function bars(it,p){const mx=Math.max(...it.map(x=>Math.abs(x[1])),1e-9);return it.length?it.map(([n,v])=>`<div class="bar"><span>${n}</span><i class="${v<0?'n':''}" style="width:${Math.abs(v)/mx*100}%"></i><b>${p?pc(v):fmt(v)}</b></div>`).join(''):'<div class="sub">No data</div>'}
function line(a,b){const W=700,H=230,L=48,B=24,T=10,pct=S.met==='GM %',al=[...a,...b].filter(v=>v!=null),mx=Math.max(...al,pct?.1:1)*1.1,mn=Math.min(0,...al),X=i=>L+i*(W-L-12)/11,Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn)),F=v=>pct?pc(v):fmt(v);
 const P2=s=>{let d='',pen=0;s.forEach((v,i)=>{if(v==null){pen=0;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=1});return d};
 let g=`<rect x="${X(S.from-1)-9}" y="${T}" width="${X(S.to-1)-X(S.from-1)+18}" height="${H-T-B}" fill="var(--ac)" opacity=".1"/>`;
 for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;g+=`<line x1="${L}" x2="${W-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--mu)">${F(v)}</text>`}
 FMS().forEach((m,i)=>g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--mu)">${m}</text>`);
 g+=`<path d="${P2(b)}" fill="none" stroke="var(--mu)" stroke-width="2" stroke-dasharray="5 4"/><path d="${P2(a)}" fill="none" stroke="var(--ac)" stroke-width="2.5"/>`;
 a.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="var(--ac)"/>`});
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg>`}
function dash(){if(!calYears().includes(S.y))S.y=CAL.fy;const es=ents(),yrs=calYears();
 const opt=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join(''),mo=v=>FMS().map((m,i)=>`<option value="${i+1}" ${i+1==v?'selected':''}>${m}</option>`).join('');

 const a0=mm(S.y,S.ver,es);S.from=1;
